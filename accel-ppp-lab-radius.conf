[modules]
log_file
vyos_vpp
pppoe
auth_pap
auth_chap_md5
auth_mschap_v2
radius
ippool
shaper

[core]
log-error=/var/log/accel-ppp-lab/core.log
thread-count=4

[common]
single-session=replace

[ppp]
verbose=1
min-mtu=1280
mtu=1492
mru=1492
ipv4=require
ipv6=deny
lcp-echo-interval=20
lcp-echo-failure=3

# accel and pppoe0 are in the root netns, RADIUS/CoA go over eno1
[pppoe]
verbose=1
ac-name=BNG-LAB
interface=pppoe0,vpp-cp=enable
# QinQ LCPs from lab-blaster-up.sh: pppoe0.<S-VLAN>.<C-VLAN>
interface=re:^pppoe0\.[0-9]+\.[0-9]+$,vpp-cp=enable

[radius]
dictionary=/usr/local/share/accel-ppp/radius/dictionary
nas-identifier=@NAS_ID@
nas-ip-address=@NAS_IP@
gw-ip-address=100.64.0.1
server=@RADIUS_SERVER@,@RADIUS_SECRET@,auth-port=1812,acct-port=1813,req-limit=0,fail-time=0
dae-server=@NAS_IP@:3799,@RADIUS_SECRET@
timeout=3
max-try=3
verbose=1
interim-verbose=1

[ip-pool]
gw-ip-address=100.64.0.1
100.64.0.2-254
100.64.16.0/20

[shaper]
vendor=Mikrotik
attr=Mikrotik-Rate-Limit
# for users without Mikrotik-Rate-Limit (subscriber 5 and up in the README)
rate-limit=50000/50000
down-burst-factor=0.5
vpp-policer-type=1r2c
vpp-cir-factor=1
vpp-cb-factor=1
vpp-conform-action=transmit
vpp-violate-action=drop
verbose=1

[log]
log-file=/var/log/accel-ppp-lab/accel-ppp.log
log-emerg=/var/log/accel-ppp-lab/emerg.log
level=4

[cli]
tcp=127.0.0.1:2001
