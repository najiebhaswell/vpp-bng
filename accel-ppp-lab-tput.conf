# Throughput runs with TRex (trex-run.sh): accel-ppp-lab-cap.conf without LCP echo, so sessions stay up after
# BNG Blaster set them up and was killed, and with a 10 Gbit/s default rate so the policers never limit.
[modules]
log_file
vyos_vpp
pppoe
auth_pap
auth_chap_md5
auth_mschap_v2
radius
ippool
shaper

[core]
log-error=/var/log/accel-ppp-lab/core.log
thread-count=4

[common]
single-session=replace

[ppp]
verbose=0
min-mtu=1280
mtu=1492
mru=1492
ipv4=require
ipv6=deny
lcp-echo-interval=0

# accel and the pb* CP devices are in the root netns, RADIUS/CoA go over eno1
[pppoe]
verbose=0
ac-name=BNG-LAB
# CP VLAN devices on tap950 (host pb) from lab-phys-up.sh: pb.<VLAN> and pb.<S-VLAN>.<C-VLAN>
interface=pb.300,vpp-cp=enable
interface=re:^pb\.[0-9]+\.[0-9]+$,vpp-cp=enable

[radius]
dictionary=/usr/local/share/accel-ppp/radius/dictionary
nas-identifier=@NAS_ID@
nas-ip-address=@NAS_IP@
gw-ip-address=100.64.0.1
server=@RADIUS_SERVER@,@RADIUS_SECRET@,auth-port=1812,acct-port=1813,req-limit=0,fail-time=0
dae-server=@NAS_IP@:3799,@RADIUS_SECRET@
timeout=3
max-try=3
verbose=0
interim-verbose=0

[ip-pool]
gw-ip-address=100.64.0.1
100.64.0.2-254
100.64.16.0/20
100.65.0.0/16
100.66.0.0/16

[shaper]
vendor=Mikrotik
attr=Mikrotik-Rate-Limit
# for users without Mikrotik-Rate-Limit (subscriber 5 and up in the README)
rate-limit=10000000/10000000
down-burst-factor=0.5
vpp-policer-type=1r2c
vpp-cir-factor=1
vpp-cb-factor=1
vpp-conform-action=transmit
vpp-violate-action=drop
verbose=0

[log]
log-file=/var/log/accel-ppp-lab/accel-ppp.log
log-emerg=/var/log/accel-ppp-lab/emerg.log
level=3

[cli]
tcp=127.0.0.1:2001
