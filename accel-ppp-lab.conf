[modules]
log_file
vyos_vpp
pppoe
auth_pap
auth_chap_md5
chap-secrets
ippool
shaper

[core]
log-error=/var/log/accel-ppp-lab/core.log
thread-count=4

[common]
single-session=replace

[ppp]
verbose=1
min-mtu=1280
mtu=1492
mru=1492
ipv4=require
ipv6=deny
lcp-echo-interval=20
lcp-echo-failure=3

[pppoe]
verbose=1
ac-name=BNG-LAB
interface=pppoe0,vpp-cp=enable

[ip-pool]
gw-ip-address=100.64.0.1
100.64.0.2-254

[chap-secrets]
chap-secrets=/etc/accel-ppp-lab.chap-secrets

[shaper]
down-burst-factor=0.5
rate-limit=100000/100000
vpp-policer-type=1r2c
vpp-cir-factor=1
vpp-cb-factor=1
vpp-conform-action=transmit
vpp-violate-action=drop
verbose=1

[log]
log-file=/var/log/accel-ppp-lab/accel-ppp.log
log-emerg=/var/log/accel-ppp-lab/emerg.log
level=4

[cli]
tcp=127.0.0.1:2001
